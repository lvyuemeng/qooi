[project]
name = "qooi"
version = "0.1.0"
description = "Quantitative trading strategy research on China A-shares using BigQuant SDK"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.60",
    "bigquant[all]",
    "httpx<0.28",
    "matplotlib>=3.11.0rc1",
    "polars",
    "python-okx>=0.4.1",

    "tickflow>=0.1.21",
]

[[tool.uv.index]]
name = "bigquant-pypi"
url = "https://pypi.bigquant.com/simple/"
priority = "supplemental"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/qooi"]

[tool.uv]
prerelease = "allow"

[project.scripts]
bq = "bigquant.cli.main:main"
