[project]
name = "qooi"
version = "0.1.0"
description = "Crypto quantitative trading toolkit — OKX market data, backtesting, evaluation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<0.28",
    "matplotlib>=3.10",
    "polars>=1.0",
    "pydantic>=2.13.3",
    "tenacity>=9.0",
    "websockets==15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.12",
    "ty>=0.0.1",
]
ml = [
    "torch>=2.3",
]
tailtree = [
    "lightgbm>=4.0",
    "optuna>=4.0",
    "scipy>=1.11",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
extend-safe-fixes = ["E402"]

[tool.ruff.lint.per-file-ignores]
"src/qooi/pipeline/discovery.py" = ["E501"]
"src/qooi/transport/okx.py" = ["E701", "E702"]
"src/qooi/scanner/__init__.py" = ["E501"]
"src/qooi/scanner/workflow.py" = ["E501", "E701"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"
root = ["./src"]

[tool.ty.src]
include = [
    "src/qooi/scanner/config.py",
    "src/qooi/scanner/output.py",
    "src/qooi/scanner/rank.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qooi"]

[tool.uv]
prerelease = "allow"
