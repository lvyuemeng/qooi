[project]
name = "qooi"
version = "0.1.0"
description = "Crypto quantitative trading toolkit — OKX market data, backtesting, evaluation"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.51",
    "httpx>=0.27,<0.28",
    "matplotlib>=3.10",
    "polars>=1.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.0",
    "python-okx>=0.4.1",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.12",
    "ty>=0.0.1",
]
ml = [
    "torch>=2.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
extend-safe-fixes = ["E402"]

[tool.ruff.lint.per-file-ignores]
"src/qooi/exchange/trading.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/qooi"]

[tool.uv]
prerelease = "allow"
