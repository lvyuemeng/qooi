[run]
universe = "research"
output = "data/output/potential/report.md"

[market]
ds = "swap"
bar = "1H"
days = 120
book_mode = "snapshot"
book_depth = 25

[potential]
timeframes = ["1H", "4H", "1D"]
refresh_mode = "incremental"

[potential.selection]
scan_budget = 80

[potential.history]
# OHLCV transition evidence. Longer-listed assets can contribute deeper n-gram statistics;
# younger assets remain explicit partial-coverage rows.
transition_days = 730

[potential.sources]
# all_scanned gives every scanned symbol books/trades/derivatives context instead of only ranked transition candidates.
scope = "all_scanned"
limit = 80
max_staleness_hours = 24
# OKX recent trades/books are current-context sources. Funding/Rubik endpoints are capped per request;
# keep Rubik at 1H for detailed source evaluation. Longer source history needs pagination in code,
# not a coarser period here.
trade_limit = 100
funding_limit = 100
rubik_period = "1H"
rubik_limit = 100
rubik_taker_unit = "2"

[potential.sources.disabled]
families = []
symbols = []

[potential.transition]
ngram_length = 4
horizon = 12
mae_mfe_horizon = 12
min_count = 30
recent_window = 720
long_window = 4320
return_threshold_pct = 0.0
min_probability = 0.05
min_directional_probability = 0.55
min_probability_delta = -0.10
min_reward_risk = 1.0
max_tail_loss_pct = 20.0
min_information_bits = 0.001

[potential.review]
# Message/context artifacts are not auto-collected by the OKX public source refresh path.
# Keep missing context in diagnostics, but do not make unavailable messages veto research review.
require_context = false
