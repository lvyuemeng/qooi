[run]
universe = "research"
output = "data/output/potential/daily-shallow/report.md"

[market]
ds = "swap"
bar = "1H"
days = 60
book_mode = "snapshot"
book_depth = 25

[potential]
timeframes = ["1H", "4H", "1D"]
refresh_mode = "incremental"

[potential.selection]
scan_budget = 40

[potential.history]
transition_days = 120

[potential.sources]
scope = "all_scanned"
limit = 40
max_staleness_hours = 24
trade_limit = 100
funding_limit = 100
rubik_period = "1H"
rubik_limit = 100
rubik_taker_unit = "2"

[potential.sources.disabled]
families = []
symbols = []

[potential.transition]
ngram_length = 4
horizon = 12
mae_mfe_horizon = 12
min_count = 24
recent_window = 360
long_window = 1440
return_threshold_pct = 0.0
min_probability = 0.05
min_directional_probability = 0.55
min_probability_delta = -0.10
min_reward_risk = 1.0
max_tail_loss_pct = 20.0
min_information_bits = 0.001

[potential.review]
require_context = false
