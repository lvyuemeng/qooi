[run]
profile = "research"
universe = "research"
exclude_symbol = ["XAU-USDT-SWAP"]

[cache]
days = 2600
min_bars = 62000
min_coverage_pct = 0

[diagnostics]
mode = "research-evaluation"
export_dir = "F:\\Stratum\\TEMP\\kilo\\qooi-research-evaluation-expanded"

[research_evaluation]
outputs = [
  "classifier",
  "tradability",
  "market-state-forward",
  "market-state-modulation",
  "trade-record-modulation",
]
include_backtest_report = true
write_exports = true
fail_fast = false

[research_evaluation.modulation_effect]
min_base_trades = 20
min_cell_trades = 10
practical_delta_threshold = 0.15

[market_state]
outcomes = ["return_pct"]

[market_state.robustness]
se_method = "newey_west"
fdr = true
fdr_alpha = 0.1
cohens_d_threshold = 0.2
