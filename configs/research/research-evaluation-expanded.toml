[run]
profile = "research"
universe = "research"
exclude_symbol = ["XAU-USDT-SWAP"]

[cache]
days = 2600
min_bars = 62000
min_coverage_pct = 0

[diagnostics]
mode = "research-evaluation"
export_dir = "F:\\Stratum\\TEMP\\kilo\\qooi-research-evaluation-reduced"

[research_evaluation]
outputs = [
  "timeframe-classifier",
  "joint-forward-quality",
]
include_backtest_report = false
write_exports = true
fail_fast = false

[research_evaluation.joint_forward_quality]
enabled = true
min_rows = 30
transition_min_rows = 50
omega_threshold = 1.5
pwpr_threshold = 2.0

[timeframes]
bars = ["15m", "1H", "4H", "1D"]

[[timeframes.specs]]
bar = "15m"
horizons = [4, 8, 16]
liquidity_lookback = 40
min_bars = 12000

[[timeframes.specs]]
bar = "1H"
horizons = [3, 5, 10]
liquidity_lookback = 20
min_bars = 62000

[[timeframes.specs]]
bar = "4H"
horizons = [2, 3, 5]
liquidity_lookback = 20

[[timeframes.specs]]
bar = "1D"
horizons = [1, 2, 3]
liquidity_lookback = 20

[research_evaluation.modulation_effect]
min_base_trades = 20
min_cell_trades = 10
practical_delta_threshold = 0.15

[market_state]
outcomes = ["return_pct"]
