[run]
universe = "research"
out = "data/output/accumulation/mvp"

[market]
ds = "swap"
bar = "1H"
days = 60
refresh = false
book_samples = 720
book_every_seconds = 5.0
book_depth = 25
book_mode = "snapshot"

[onchain]
provider = "etherscan"
lookback_days = 60
poll_minutes = 10
exchange_address_book = ""

[sources.disabled]
families = []
symbols = []
polymarket_queries = []

[sources.polymarket]
provider = "gamma"

[sources.messages]
path = ""

[broad_scan]
providers = ["coingecko", "coinpaprika", "defillama"]
optional_providers = ["cryptopanic"]
max_assets = 500
coingecko_pages = 2
coinpaprika_max_assets = 1000
min_market_cap_usd = 1000000.0
max_market_cap_usd = 500000000.0
min_volume_24h_usd = 500000.0
tvl_change_1d_min_pct = 20.0
output_top_n = 25

[broad_scan.coingecko]
api_key_env = "COINGECKO_DEMO_API_KEY"
vs_currency = "usd"
order = "volume_desc"
per_page = 250
price_change_percentage = ["1h", "24h"]
include_trending = true
trending_weight = 4.0

[broad_scan.cryptopanic]
api_key_env = "CRYPTOPANIC_API_KEY"
enabled_without_key = false

[features]
flow_zscore_window_hours = 168
flow_negative_streak_hours = 2
depth_window_minutes = 60
large_trade_usd = 50000.0
large_trade_multiple = 5.0
resilience_minutes = 5
ma_hours = 200

[scoring]
yellow_threshold = 20
orange_threshold = 35
red_threshold = 40
flow_outflow_z = -3.0
flow_inflow_z = 3.0
whale_accumulation_threshold = 0.70
depth_imbalance_threshold = 0.30
down_day_return_threshold = -0.02
resilience_threshold = 0.60
mention_growth_hot = 3.0
max_position_pct = 0.05
stop_loss_pct = 0.05
