[run]
profile = "research"
universe = "research"
ds = "swap"

[req]
days = 730
min = 12000
cap = 12000
trim = true
cov = 0
refresh = false

[diagnostics]
mode = "research-evaluation"

[research_evaluation]
outputs = ["timeframe-classifier"]
include_backtest_report = false
write_exports = false

[learn]
input = "sequence"
model = "vq-rssm"
state = "behavior_state_id"
timeframe = "1H"
out = "data/output/learned-states/vq-rssm"
feature_columns = ["open_rel", "high_rel", "low_rel", "close_rel", "volume_log_rel"]

[learn.run]
phases = ["train", "predict", "evaluate"]
checkpoint = ""
states = ""

[learn.objective]
terms = ["reconstruct", "vq", "kl"]
reconstruct = 1.0
vq = 1.0
kl = 1.0
future = 0.0

[learn.win]
len = 64
stride = 1
train = 0.7
valid = 0.2

[learn.seq]
chunk = 256
warmup = 64
stride = 1
carry = true
reset = "asset_split"

[learn.scale]
on = true
method = "ewm_std"
ret = "close_rel"
cols = ["open_rel", "high_rel", "low_rel", "close_rel"]
half = 10
min_periods = 2
floor = 0.0001
cap = 0.10
output_column = "volatility_scale"

[learn.vq]
hidden = 128
latent = 16
codes = 128
commit = 0.25
kl_steps = 5000
eps = 0.00000001

[learn.train]
batch = 512
lr = 0.001
grad_clip = 1.0
epochs = 5
seed = 1
device = "auto"
threads = 0
log_every = 100
valid_batch = 4096
pred_batch = 4096

[learn.eval]	
h = [1, 3, 6]
split = "test"
cost = 5.0
min = 1
