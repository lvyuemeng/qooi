[run]
profile = "smoke"
universe = "core"

[cache]
days = 120
min_bars = 500
min_coverage_pct = 0

[diagnostics]
mode = "research-evaluation"

[research_evaluation]
outputs = ["timeframe-classifier"]
include_backtest_report = false
write_exports = false

[research_evaluation.learned_states]
enabled = true
model = "vq-rssm"
actions = ["train", "predict", "evaluate"]
state_column = "behavior_state_id"
timeframe = "1H"
feature_columns = ["open_rel", "high_rel", "low_rel", "close_rel", "volume_log_rel"]
checkpoint_dir = "data/output/learned-states/vq-rssm"

[research_evaluation.learned_states.volatility_scaling]
enabled = true
method = "ewm_std"
return_column = "close_rel"
columns = ["open_rel", "high_rel", "low_rel", "close_rel"]
half_life = 10
min_periods = 2
floor = 0.0001
cap = 0.10
output_column = "volatility_scale"

[research_evaluation.learned_states.window]
seq_len = 20
stride = 2
train_pct = 0.7
valid_pct = 0.2

[research_evaluation.learned_states.vq_rssm]
hidden_dim = 32
latent_dim = 8
num_codes = 32
commitment_cost = 0.25
kl_anneal_steps = 200
eps = 0.00000001

[research_evaluation.learned_states.train]
batch_size = 16
learning_rate = 0.001
max_grad_norm = 1.0
epochs = 2
