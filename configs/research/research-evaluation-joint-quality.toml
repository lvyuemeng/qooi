[run]
profile = "research"
universe = "research"
exclude_symbol = ["XAU-USDT-SWAP"]

[cache]
days = 2600
min_bars = 62000
min_coverage_pct = 0

[diagnostics]
mode = "research-evaluation"
export_dir = "F:\\Stratum\\TEMP\\kilo\\qooi-research-evaluation-joint-quality"

[research_evaluation]
outputs = ["timeframe-classifier", "joint-forward-quality"]
include_backtest_report = false
write_exports = true
fail_fast = false

[research_evaluation.joint_forward_quality]
enabled = true
min_rows = 30
transition_min_rows = 50
omega_threshold = 1.5
pwpr_threshold = 2.0

[market_state]
outcomes = ["return_pct"]
