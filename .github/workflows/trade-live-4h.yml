name: qooi-live-4h

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "LIVE" to confirm'
        required: true
        default: ''
      dry_run:
        description: 'Dry run first'
        type: boolean
        default: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Safety gate
        if: github.event.inputs.confirm != 'LIVE' && github.event.inputs.dry_run == 'false'
        run: |
          echo "ERROR: Set confirm='LIVE' to place real orders"
          exit 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - name: Run
        run: |
          MODE="dry"
          if [ "${{ github.event.inputs.dry_run }}" = "false" ] && [ "${{ github.event.inputs.confirm }}" = "LIVE" ]; then
            MODE="live"
          fi
          uv run python scripts/trade.py live "$MODE"
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY_LIVE }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY_LIVE }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE_LIVE }}
          OKX_FLAG: "0"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 365
