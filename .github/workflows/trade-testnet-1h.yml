name: qooi-testnet-1h

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - name: Run
        run: uv run python scripts/trade.py testnet
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY_TEST }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY_TEST }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE_TEST }}
          OKX_FLAG: "1"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 90
