name: qooi-testnet-4h

# Testnet: auto every 4h
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync

      - name: Run ensemble (ETH + SOL 4H)
        id: trade
        run: |
          uv run python -c "
          import json, os
          from qooi.exchange.trading import (
              TradingClient, LiveExecutor,
              default_signal_source, PortfolioConfig, PortfolioRunner,
          )

          tc = TradingClient()

          # ---- pre-trade ----
          bal = tc.balance('USDT')
          usdt_pre = float(bal[0].get('availBal','0') or 0) if bal else 0.0
          pos_pre = tc.positions()

          # ---- signal + execute ----
          src = default_signal_source()
          config = PortfolioConfig(
              pairs=[
                  dict(symbol='ETH-USDT', tf='4h', capital=100, risk_pct=0.03, leverage=1.0),
                  dict(symbol='SOL-USDT', tf='4h', capital=50,  risk_pct=0.05, leverage=1.0),
              ],
              dry_run=False,
          )
          runner = PortfolioRunner(config)
          runner.compute_all_signals(source=src)
          runner.step(source=src)

          # ---- post-trade ----
          bal2 = tc.balance('USDT')
          usdt_post = float(bal2[0].get('availBal','0') or 0) if bal2 else 0.0
          pos_post = tc.positions()
          report_eth = LiveExecutor.report('ETH-USDT', '4h')
          report_sol = LiveExecutor.report('SOL-USDT', '4h')

          # ---- write summary file ----
          out = os.environ.get('GITHUB_OUTPUT', 'summary.json')
          state = {
              'usdt_pre': round(usdt_pre, 2),
              'usdt_post': round(usdt_post, 2),
              'change': round(usdt_post - usdt_pre, 2),
              'positions_pre': len(pos_pre),
              'positions_post': len(pos_post),
              'eth': report_eth,
              'sol': report_sol,
          }
          with open(out, 'w') as f:
              json.dump(state, f)
          print(json.dumps(state, indent=2))
          "
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY_TEST }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY_TEST }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE_TEST }}
          OKX_FLAG: "1"

      - name: Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## qooi Testnet 4H

          | Metric | Value |
          |---|---|
          EOF
          # parse the JSON from the previous step output (we wrote it to a temp file)
          # fallback: use GITHUB_OUTPUT
          if [ -f summary.json ]; then
            python3 -c "
          import json
          with open('summary.json') as f:
              s = json.load(f)
          for k,v in s.items():
              print(f'|{k}|{v}|')
          " >> $GITHUB_STEP_SUMMARY
          fi
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Full logs available in artifacts tab.' >> $GITHUB_STEP_SUMMARY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 90
