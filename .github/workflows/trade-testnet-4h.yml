name: qooi-testnet-4h

# Testnet: auto every 4h, no human approval, free to fail
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync

      - name: Run testnet ensemble (ETH + SOL 4H)
        run: |
          uv run python -c "
          from qooi.exchange.trading import default_signal_source, PortfolioConfig, PortfolioRunner

          src = default_signal_source()
          config = PortfolioConfig(
              pairs=[
                  dict(symbol='ETH-USDT', tf='4h', capital=100, risk_pct=0.03),
                  dict(symbol='SOL-USDT', tf='4h', capital=50,  risk_pct=0.05),
              ],
              dry_run=False,
          )
          runner = PortfolioRunner(config)
          runner.compute_all_signals(source=src)
          runner.step(source=src)
          "
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 90
